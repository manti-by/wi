[package]
name = "wi"
version = "0.2.1"
edition = "2024"
description = "OpenWiki MCP server: search and read Markdown wiki pages over MCP"
license = "BSD-3-Clause"
repository = "https://github.com/manti-by/wi"
keywords = ["mcp", "wiki", "search", "bm25", "cli"]

[dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
clap = { version = "4.5.54", features = ["derive"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
